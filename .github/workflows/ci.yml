name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Type-check + build
        run: npm run build

      - name: Unit + integration tests
        run: npm test

      # Self-host the action against the bundled demo so a breaking change
      # to the CLI surfaces here before it breaks downstream workflows.
      - name: Run logflow-sim against the demo
        run: |
          node dist/cli/main.js parse conf-demo --fail-on=errors --format=github
          node dist/cli/main.js test  conf-demo --fail-on=errors --format=github
