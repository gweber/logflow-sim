###############################################################################
# rsyslog-sim demo configuration
#
# This is an illustrative configuration that exercises every RainerScript
# feature the simulator supports. It is *not* tuned for production rsyslog
# (no queue sizing, no TLS, no real forwarding targets).
#
# Ports used by this demo:
#   514/udp,tcp    catchall — classify by programname / fromhost lookups
#   6514/udp       palo-alto firewalls
#   6601/tcp       network devices (Cisco / F5 / Juniper / etc.)
###############################################################################

#
# Modules
#
module(load="imudp" threads="2")
module(load="imtcp")

#
# Globals
#
# preserveFQDN keeps long hostnames intact in $hostname when a sender presents
# its FQDN. Otherwise rsyslog truncates at the first dot, which silently breaks
# downstream classification.
#
global(workDirectory="/var/spool/rsyslog" preserveFQDN="on")
$DefaultRuleset catchall

#
# Templates
#
# DynaFile templates resolve at action time using the current message's
# properties. %$YEAR%-%$MONTH%-%$DAY%-%$HOUR% slices logs into hourly files,
# which keeps individual files small enough to ship to Splunk without re-batch.
#
template(name="hourly_by_program" type="string"
         string="/var/log/syslog/%$MYHOSTNAME%/%programname%/%hostname%/%$YEAR%-%$MONTH%-%$DAY%-%$HOUR%.log")

template(name="hourly_by_sourcetype" type="string"
         string="/var/log/syslog/%$MYHOSTNAME%/%!sourcetype%/%hostname%/%$YEAR%-%$MONTH%-%$DAY%-%$HOUR%.log")

template(name="hourly_by_extracted_host" type="string"
         string="/var/log/syslog/%$MYHOSTNAME%/firewall/%!extracted_host%/%$YEAR%-%$MONTH%-%$DAY%-%$HOUR%.log")

# Forwarding payload in RFC5424-ish shape. Used by the omfwd action that sends
# everything to a downstream collector for indexing.
template(name="forward_payload" type="string"
         string="<%PRI%>1 %timestamp:::date-rfc3339% %hostname% %programname% - - - %msg%")

# Regex-extract templates. Real rsyslog uses these to pull an internal hostname
# out of a CEF/leef payload when $hostname is unreliable (load balancer in path,
# NAT, syslog relay, etc.). The pattern is rsyslog's R,ERE,N,FIELD format.
template(name="extract_cef_hostname" type="string"
         string="%msg:R,ERE,1,FIELD:dvc=([A-Za-z0-9_-]+)--end%")

template(name="extract_originsicname" type="string"
         string="%msg:R,ERE,1,FIELD:originsicname=CN=([A-Za-z0-9]+)--end%")

#
# Lookup tables
#
# Three formats are loaded here to demonstrate that the simulator handles all
# of them transparently:
#   - rsyslog-native  (sourcetypes.json — has "nomatch" default)
#   - plain object    (host-aliases.json)
#   - array of objects (known-firewalls.json)
#
lookup_table(name="sourcetypes"     file="lookups/sourcetypes.json"     reloadOnHUP="on")
lookup_table(name="host_aliases"    file="lookups/host-aliases.json"    reloadOnHUP="on")
lookup_table(name="known_firewalls" file="lookups/known-firewalls.json" reloadOnHUP="on")

#
# Inputs
#
# Order is intentional: more-specific ports first so they bind their own
# ruleset, with 514 last as the catchall.
#
input(type="imudp" port="6514" ruleset="firewall_rs")
input(type="imtcp" port="6601" ruleset="network_rs")
input(type="imudp" port="514"  ruleset="catchall")
input(type="imtcp" port="514"  ruleset="catchall")

# Pull in the per-ruleset definitions.
include(file="etc/rsyslog.d/*.conf")
