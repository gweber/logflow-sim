###############################################################################
# Firewall ruleset (port 6514)
#
# Palo Alto and Check Point firewalls reach us via a syslog relay, so
# $fromhost / $hostname point at the relay, not the device. The real device
# name is embedded in the message body and has to be pulled out with a regex.
#
# Two extraction patterns are tried in order; the first that produces a
# non-empty result wins. If both fail we fall back to $fromhost so the message
# is never dropped silently.
###############################################################################

ruleset(name="firewall_rs") {

    # Check Point: originsicname=CN=<host>,OU=...
    reset $!extracted_host = exec_template("extract_originsicname");

    # CEF dvc=<host> field, used by Palo Alto Cortex and several SIEM relays.
    if $!extracted_host == "" then {
        reset $!extracted_host = exec_template("extract_cef_hostname");
    }

    # Last-resort fallback. Pre-lowercase so downstream directory names are
    # consistent regardless of sender capitalization.
    if $!extracted_host == "" then {
        reset $!extracted_host = tolower($fromhost);
    } else {
        reset $!extracted_host = tolower($!extracted_host);
    }

    # Tag separately for known-good devices vs. ones we haven't seen before —
    # the known set is what we expect on this port; unknowns are worth alerting on.
    set $.known = lookup("known_firewalls", $!extracted_host);
    if $.known != "" then {
        set $!sourcetype = "pan:traffic";
    } else {
        set $!sourcetype = "pan:traffic:unknown_device";
    }

    action(type="omfile" DynaFile="hourly_by_extracted_host")

    action(type="omfwd"
           Target="collector.netverdict.io"
           Port="6515"
           Protocol="tcp"
           Template="forward_payload")
    stop
}
