###############################################################################
# Network device ruleset (port 6601/tcp)
#
# Cisco, Juniper, F5, and similar gear all share this port. Classification is
# done by programname (the leading tag before the colon in syslog), with a
# severity-based override that pulls high-severity events into a separate
# alert stream regardless of vendor.
###############################################################################

ruleset(name="network_rs") {

    # PRI-derived severity. 0-3 are emerg/alert/crit/err — anything in that
    # band gets duplicated into the alerts pipeline before normal handling.
    if $syslogseverity < 4 then {
        set $!alert = "1";
        action(type="omfwd"
               Target="alerts.netverdict.io"
               Port="6515"
               Protocol="tcp"
               Template="forward_payload")
    }

    # Vendor classification. tolower() guards against gear that uppercases its
    # programname (some Cisco IOS versions do).
    set $.prog = tolower($programname);

    if $.prog startswith_i ["cisco-", "ios-", "asa-"] then {
        set $!sourcetype = "cisco:" & $.prog;
    } else if $.prog startswith_i "juniper" then {
        set $!sourcetype = "juniper:rt_flow";
    } else if $.prog startswith_i "f5-" then {
        set $!sourcetype = "f5:bigip";
    } else {
        # Unknown vendor on a port reserved for network gear: keep the message
        # but tag it so it's findable. Do not stop — let it fall through to
        # the default catchall after this ruleset returns.
        set $!sourcetype = "network:unclassified";
    }

    action(type="omfile" DynaFile="hourly_by_sourcetype")
    stop
}
