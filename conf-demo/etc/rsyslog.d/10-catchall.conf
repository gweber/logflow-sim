###############################################################################
# Catchall ruleset (port 514)
#
# Default landing zone for any message that didn't hit a dedicated port. The
# strategy is:
#   1. Resolve sourcetype via lookup tables (programname first, then
#      fromhost alias).
#   2. Branch on well-known signatures embedded in $msg (zscaler, cef).
#   3. Forward everything to the collector, then stop.
###############################################################################

ruleset(name="catchall") {

    # Try programname → sourcetype. Empty string is the "no match" sentinel
    # because the rsyslog-native table's "nomatch" is "".
    set $!sourcetype = lookup("sourcetypes", $programname);

    # Multi-axis parallel taxonomies — the SIEMTarget retag flow rewrites
    # these into the destination's native vocabulary. The three fields are
    # populated from independent lookup tables so a single demo
    # demonstrates the multi-vendor target story end-to-end.
    set $!category = lookup("categories", $programname);
    set $!event_category = lookup("ecs_event_category", $programname);

    # Fallback: maybe the sender uses an alias hostname (load balancer name,
    # virtual hostname, etc.). The host_aliases table maps those to real
    # programname-equivalents, which we re-feed into sourcetypes.
    if $!sourcetype == "" then {
        set $.real_program = lookup("host_aliases", $fromhost);
        if $.real_program != "" then {
            set $!sourcetype = lookup("sourcetypes", $.real_program);
        }
    }

    # Zscaler ships several streams that share a port; cheapest classifier is
    # a substring match on $rawmsg.
    if $rawmsg contains_i "zscaler-dns" then {
        set $!sourcetype = "zscaler:dns";
    } else if $rawmsg contains_i "zscaler-firewall" then {
        set $!sourcetype = "zscaler:firewall";
    } else if $rawmsg contains_i "zscaler-user-activity" then {
        set $!sourcetype = "zscaler:useractivity";
    }

    # Last resort: never leave $!sourcetype empty — downstream parsing breaks
    # when the field is missing entirely vs. set to "syslog".
    if $!sourcetype == "" then {
        set $!sourcetype = "syslog";
    }

    action(type="omfile" DynaFile="hourly_by_sourcetype")

    action(type="omfwd"
           Target="collector.netverdict.io"
           Port="6515"
           Protocol="tcp"
           Template="forward_payload")
    stop
}
