###############################################################################
# logflow-sim — DELIBERATELY BROKEN demo config.
#
# Every "issue" below is intentional. Mounting this tree lights up the
# validation rules in the Config page. Don't copy this to production.
###############################################################################

# Globals — the legacy directive form for `$DefaultRuleset`. The validator
# expects every default-ruleset to point at a real ruleset. We point at
# `catchall_typo`, which doesn't exist (it's spelled `catchall` in the
# include file). rsyslog will silently fall through to RSYSLOG_DefaultRuleset
# at runtime; ops finds out via SIEM-side absence-alerts hours later.
$DefaultRuleset catchall_typo

# Lookup table referencing a JSON file that doesn't exist in this tree.
# The loader emits W_LOOKUP_MISSING; the validator mirrors it as
# V_LOOKUP_NOT_LOADED so a CI gate trips on it.
lookup_table(name="sourcetypes" file="lookups/sourcetypes-but-spelled-wrong.json")

# Modules. Note what's NOT here:
#   - module(load="imtcp")     ← commented out, but imtcp input is declared below
#   - module(load="omkafka")   ← never declared, but omkafka action is used
module(load="imudp")
# module(load="imtcp")

# imudp is fine — module is loaded above.
input(type="imudp" port="514" ruleset="catchall")

# imtcp footgun: the input is declared, but rsyslog can't bind the listener
# at startup because no module(load="imtcp") statement exists. Silent traffic
# loss on port 6601 until someone notices.
input(type="imtcp" port="6601" ruleset="catchall")

# Includes pull in the per-feature rulesets.
include(file="etc/rsyslog.d/*.conf")
