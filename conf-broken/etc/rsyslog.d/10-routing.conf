###############################################################################
# Routing rules — also intentionally broken.
###############################################################################

ruleset(name="catchall") {

    # 1. Action references a template "JsonForElastic" that no template(...)
    #    statement declares. rsyslog errors at startup for this action and
    #    routes through the synthetic default → V_RSYSLOG_TEMPLATE_UNDEFINED.
    if $programname == "audit" then {
        action(type="omfile"
               file="/var/log/audit.log"
               template="JsonForElastic")
    }

    # 2. omkafka without module(load="omkafka"). rsyslog refuses the action at
    #    startup → V_MODULE_MISSING.
    if $programname == "metrics" then {
        action(type="omkafka"
               broker="kafka.netverdict.io:9092"
               topic="metrics-firehose")
    }

    # 3. Call into a ruleset that doesn't exist anywhere → V_UNDEFINED_CALL_TARGET.
    call orphan_handler

    # 4. Last statement is an `if` without an `else`. Messages whose
    #    programname isn't "sshd" silently drop → V_SILENT_DROP.
    if $programname == "sshd" then {
        action(type="omfile" file="/var/log/secure")
    }
}
