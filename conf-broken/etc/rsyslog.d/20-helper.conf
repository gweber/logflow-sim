###############################################################################
# Helper rulesets — two more intentional misconfigurations.
###############################################################################

# 5. This ruleset is declared but no input binds to it and nothing calls it.
#    → V_DEAD_RULESET (info-level)
ruleset(name="enrich_audit") {
    set $!sourcetype = "audit";
    action(type="omfile" file="/var/log/audit-enriched.log")
}

# 6. This ruleset's body ends with a `set` — it mutates state and returns
#    without producing any output → V_SILENT_DROP. Even though it isn't
#    currently reached (no input binds it), if a future PR re-wires an
#    input here every message would silently drop.
ruleset(name="tag_only") {
    set $!sourcetype = "tagged";
}
